<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>김프 모니터</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg: #0e1116;
      --panel: #161b22;
      --border: #2a313c;
      --text: #e6edf3;
      --muted: #8b949e;
      --kimp: #2ea043;
      --reverse: #f85149;
      --accent: #58a6ff;
      --dim: #6e7681;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }
    header h1 { margin: 0; font-size: 18px; }
    .status { color: var(--muted); font-size: 13px; flex: 1 1 auto; min-width: 200px; }
    .controls {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      width: 100%;
    }
    .controls label { color: var(--muted); font-size: 13px; display: inline-flex; gap: 6px; align-items: center; }
    .controls input, .controls select {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 5px 8px;
      font-size: 13px;
    }
    main { padding: 14px 20px; }
    .warning {
      background: #4a2e05;
      border: 1px solid #8b6508;
      padding: 8px 12px;
      border-radius: 4px;
      margin-bottom: 12px;
      font-size: 13px;
      word-break: break-word;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
    }
    th, td { padding: 8px 10px; text-align: right; border-bottom: 1px solid var(--border); white-space: nowrap; }
    th:first-child, td:first-child { text-align: left; }
    th {
      background: #1c2128;
      color: var(--muted);
      font-weight: 600;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      cursor: pointer;
      user-select: none;
    }
    th:hover { color: var(--text); }
    tbody tr:hover { background: #1c2128; }
    .dir-KIMP { color: var(--kimp); font-weight: 600; }
    .dir-REVERSE { color: var(--reverse); font-weight: 600; }
    .num { font-variant-numeric: tabular-nums; }
    .pct-pos { color: var(--kimp); }
    .pct-neg { color: var(--reverse); }
    .net-bad { color: var(--dim); }
    .empty { padding: 40px; text-align: center; color: var(--muted); }

    /* 모바일 최적화 */
    @media (max-width: 640px) {
      header { padding: 10px 12px; gap: 8px; }
      header h1 { font-size: 16px; }
      .status { font-size: 12px; min-width: 0; }
      .controls { gap: 6px; }
      .controls label { font-size: 12px; }
      .controls input, .controls select { padding: 4px 6px; font-size: 12px; }
      main { padding: 10px 8px; }
      th, td { padding: 6px 5px; font-size: 12px; }
      th { font-size: 10px; letter-spacing: 0.02em; }
      /* 방향 컬럼 숨김 — 프리미엄 부호/색상으로 방향 식별 가능 */
      th.col-dir, td.col-dir { display: none; }
      /* 해외 USDT 컬럼 숨김 — 해외 KRW로 충분 */
      th.col-overseas-usdt, td.col-overseas-usdt { display: none; }
    }
    @media (max-width: 400px) {
      /* 초협소 화면: Upbit KRW도 숨기고 핵심 지표만 */
      th.col-upbit-krw, td.col-upbit-krw { display: none; }
    }
  </style>
</head>
<body>
<header>
  <h1>김프 모니터</h1>
  <span class="status" id="status">로딩 중…</span>
  <div class="controls">
    <label>방향
      <select id="filter-dir">
        <option value="all">전체</option>
        <option value="KIMP">김프만</option>
        <option value="REVERSE">역프만</option>
      </select>
    </label>
    <label>최소 |%|
      <input id="filter-min" type="number" step="0.1" value="0" style="width: 60px" />
    </label>
    <label>심볼
      <input id="filter-sym" type="text" placeholder="BTC,ETH…" style="width: 110px" />
    </label>
    <label>주기(s)
      <input id="interval" type="number" min="2" step="1" value="5" style="width: 52px" />
    </label>
    <label title="업비트 taker 수수료 (%)">업비트%
      <input id="fee-upbit" type="number" step="0.01" min="0" value="0.05" style="width: 60px" />
    </label>
    <label title="해외 거래소 taker 수수료 (%)">해외%
      <input id="fee-overseas" type="number" step="0.01" min="0" value="0.1" style="width: 60px" />
    </label>
  </div>
</header>

<main>
  <div id="warning" class="warning" style="display:none"></div>
  <table>
    <thead>
      <tr>
        <th data-sort="symbol">심볼</th>
        <th data-sort="direction" class="col-dir">방향</th>
        <th data-sort="premium_pct" class="num">프리미엄%</th>
        <th data-sort="net_pct" class="num" title="순수익 = |프리미엄| − 업비트 수수료 − 해외 수수료 (출금비 제외)">순수익%</th>
        <th data-sort="upbit_krw" class="num col-upbit-krw">Upbit (KRW)</th>
        <th data-sort="binance_usdt" class="num col-overseas-usdt" id="th-overseas-usdt">해외 (USDT)</th>
        <th data-sort="binance_krw" class="num" id="th-overseas-krw">해외 (KRW)</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <div id="empty" class="empty" style="display:none">표시할 데이터가 없습니다.</div>
</main>

<script>
const fmt = (n, digits = 2) =>
  n.toLocaleString("ko-KR", { minimumFractionDigits: digits, maximumFractionDigits: digits });

let sortKey = "net_pct";
let sortDir = -1; // desc
let timer = null;
let lastData = null;

// 수수료 값 localStorage에서 복원
function restoreFees() {
  const u = localStorage.getItem("fee-upbit");
  const o = localStorage.getItem("fee-overseas");
  if (u !== null) document.getElementById("fee-upbit").value = u;
  if (o !== null) document.getElementById("fee-overseas").value = o;
}
function persistFees() {
  localStorage.setItem("fee-upbit", document.getElementById("fee-upbit").value);
  localStorage.setItem("fee-overseas", document.getElementById("fee-overseas").value);
}

function getFees() {
  const up = Math.max(0, parseFloat(document.getElementById("fee-upbit").value) || 0);
  const ov = Math.max(0, parseFloat(document.getElementById("fee-overseas").value) || 0);
  return { up, ov, total: up + ov };
}

function applyFiltersAndRender() {
  if (!lastData) return;
  const dir = document.getElementById("filter-dir").value;
  const minAbs = parseFloat(document.getElementById("filter-min").value) || 0;
  const symFilter = document.getElementById("filter-sym").value
    .toUpperCase()
    .split(",")
    .map((s) => s.trim())
    .filter(Boolean);
  const fees = getFees();

  let rows = lastData.spreads
    .filter((s) => {
      if (dir !== "all" && s.direction !== dir) return false;
      if (Math.abs(s.premium_pct) < minAbs) return false;
      if (symFilter.length && !symFilter.includes(s.symbol)) return false;
      return true;
    })
    .map((s) => ({ ...s, net_pct: Math.abs(s.premium_pct) - fees.total }));

  rows.sort((a, b) => {
    const av = a[sortKey], bv = b[sortKey];
    if (typeof av === "string") return av.localeCompare(bv) * sortDir;
    return (av - bv) * sortDir;
  });

  const tbody = document.getElementById("rows");
  const empty = document.getElementById("empty");
  tbody.innerHTML = "";
  if (!rows.length) {
    empty.style.display = "block";
    return;
  }
  empty.style.display = "none";
  for (const s of rows) {
    const pctClass = s.premium_pct >= 0 ? "pct-pos" : "pct-neg";
    const psign = s.premium_pct >= 0 ? "+" : "";
    const netClass = s.net_pct > 0 ? "pct-pos" : "net-bad";
    const nsign = s.net_pct >= 0 ? "+" : "";
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${s.symbol}</td>
      <td class="col-dir dir-${s.direction}">${s.direction === "KIMP" ? "김프" : "역프"}</td>
      <td class="num ${pctClass}">${psign}${fmt(s.premium_pct, 2)}%</td>
      <td class="num ${netClass}">${nsign}${fmt(s.net_pct, 2)}%</td>
      <td class="num col-upbit-krw">${fmt(s.upbit_krw, 2)}</td>
      <td class="num col-overseas-usdt">${fmt(s.binance_usdt, 4)}</td>
      <td class="num">${fmt(s.binance_krw, 2)}</td>
    `;
    tbody.appendChild(tr);
  }
}

async function refresh() {
  try {
    const res = await fetch("/api/spreads");
    const data = await res.json();
    const warn = document.getElementById("warning");
    if (!res.ok) {
      warn.style.display = "block";
      warn.textContent = `오류: ${data.error || res.statusText}`;
      return;
    }
    if (data.warning) {
      warn.style.display = "block";
      warn.textContent = `경고: ${data.warning} (캐시 표시 중)`;
    } else {
      warn.style.display = "none";
    }
    lastData = data;
    const src = (data.overseas_source || "?").toUpperCase();
    document.getElementById("status").textContent =
      `업데이트 ${data.updated_at.slice(11, 19)} · USD/KRW ${fmt(data.usd_krw, 2)} · 해외 ${src} · 공통 ${data.common_count}종`;
    document.getElementById("th-overseas-usdt").textContent = `${src} (USDT)`;
    document.getElementById("th-overseas-krw").textContent = `${src} (KRW)`;
    applyFiltersAndRender();
  } catch (err) {
    const warn = document.getElementById("warning");
    warn.style.display = "block";
    warn.textContent = `네트워크 오류: ${err.message}`;
  }
}

function scheduleRefresh() {
  if (timer) clearInterval(timer);
  const sec = Math.max(2, parseInt(document.getElementById("interval").value) || 5);
  timer = setInterval(refresh, sec * 1000);
}

document.querySelectorAll("th[data-sort]").forEach((th) => {
  th.addEventListener("click", () => {
    const key = th.dataset.sort;
    if (sortKey === key) sortDir = -sortDir;
    else { sortKey = key; sortDir = key === "symbol" ? 1 : -1; }
    applyFiltersAndRender();
  });
});

["filter-dir", "filter-min", "filter-sym"].forEach((id) => {
  document.getElementById(id).addEventListener("input", applyFiltersAndRender);
});
["fee-upbit", "fee-overseas"].forEach((id) => {
  document.getElementById(id).addEventListener("input", () => {
    persistFees();
    applyFiltersAndRender();
  });
});
document.getElementById("interval").addEventListener("change", scheduleRefresh);

restoreFees();
refresh();
scheduleRefresh();
</script>
</body>
</html>
